name: QuickBooks check (QB is the source of truth)
# Each morning (after the QuickBooks invoices are copied to the "QB Invoices" tab), makes the CRM's invoice numbers,
# dates, tax and paid status match QuickBooks and lists anything that doesn't line up on the "QB Check" tab.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "47 14 * * *"
permissions:
  contents: read
  id-token: write
concurrency: { group: crm-fix, cancel-in-progress: false }
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        run: npm install --no-audit --no-fund --loglevel=error 2>&1 | tail -2
      - working-directory: worker
        env:
          FIREBASE_PROJECT: ssc-crm-a7224
          FIX_STEP: qb
          WATCH_MIN: "25"
          SHEETS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: node fix.mjs
