name: CRM mail (send, log Gmail, signatures)
# Always on: each run loops for ~5 hours — every minute it sends the emails queued in the CRM (from each person's own
# @streetsignsupply.com Gmail) and follows up signed links; every 10 minutes it logs customer emails from Gmail.
# The hourly schedule starts the next run (a run waits while one is going), so there's no gap when one ends.
# Until domain-wide delegation is set in Google Admin it only checks and prints the client ID to authorize. Counts only.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      loop: { description: "minutes to keep running (0 = one pass)", default: "300" }
permissions:
  contents: read
  id-token: write
  models: read
concurrency: { group: crm-mail, cancel-in-progress: false }
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        run: npm install --no-audit --no-fund --loglevel=error @google-cloud/firestore@7 google-auth-library@9 2>&1 | tail -1
      # headless Chrome, to save each signed quote/proof as a PDF in the project's Files
      - working-directory: worker
        continue-on-error: true
        run: npx playwright install --with-deps chromium 2>&1 | tail -2
      - working-directory: worker
        env:
          FIREBASE_PROJECT: ssc-crm-a7224
          SA_TOKEN: ${{ steps.gauth.outputs.access_token }}
          LOOP_MIN: ${{ github.event.inputs.loop || '300' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node mail.mjs
