name: Email open tracking (setup)
# Run by hand (Matt approved 2 Nov 2026). Sets up what records when a customer opens an email sent from the CRM, in its
# own two storage buckets — the CRM's file storage is never touched or made public:
#   ssc-crm-a7224-open      public, holds only one 1x1 picture (p.gif) that each CRM email loads as /p.gif?m=<email id>
#   ssc-crm-a7224-openlog   private, where Google writes the hourly fetch log the mail worker reads to mark emails opened
# Prints status codes only.
on:
  workflow_dispatch:
    inputs:
      step: { description: "setup", default: "setup" }
permissions: { contents: read, id-token: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/devstorage.full_control
      - env: { TOK: "${{ steps.gauth.outputs.access_token }}" }
        run: |
          P=ssc-crm-a7224; PB=ssc-crm-a7224-open; LB=ssc-crm-a7224-openlog; H="Authorization: Bearer $TOK"; J="Content-Type: application/json"
          say(){ echo "::notice::$1"; }
          mk(){ c=$(curl -s -o m.json -w "%{http_code}" -X POST -H "$H" -H "$J" "https://storage.googleapis.com/storage/v1/b?project=$P" -d "{\"name\":\"$1\",\"location\":\"US-WEST1\",\"storageClass\":\"STANDARD\",\"iamConfiguration\":{\"uniformBucketLevelAccess\":{\"enabled\":true}}$2}"); say "create $1: $c $(grep -o '"message": *"[^"]*"' m.json | head -1)"; }
          mk $LB ',"lifecycle":{"rule":[{"action":{"type":"Delete"},"condition":{"age":30}}]}'
          mk $PB ''
          # the log bucket: only Google's storage logger may write into it
          curl -s -H "$H" "https://storage.googleapis.com/storage/v1/b/$LB/iam" > li.json
          python3 -c 'import json; p=json.load(open("li.json")); b=p.setdefault("bindings",[]); b.append({"role":"roles/storage.objectCreator","members":["group:cloud-storage-analytics@google.com"]}); json.dump({"bindings":b,"etag":p.get("etag")},open("li2.json","w"))'
          say "log bucket writer: $(curl -s -o x.json -w '%{http_code}' -X PUT -H "$H" -H "$J" "https://storage.googleapis.com/storage/v1/b/$LB/iam" -d @li2.json) $(grep -o '"message": *"[^"]*"' x.json | head -1)"
          # the picture: one transparent pixel, never cached, so every open is fetched (and logged)
          printf 'R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' | base64 -d > p.gif
          say "picture: $(curl -s -o x.json -w '%{http_code}' -X POST -H "$H" -H 'Content-Type: image/gif' --data-binary @p.gif "https://storage.googleapis.com/upload/storage/v1/b/$PB/o?uploadType=media&name=p.gif")"
          say "no cache: $(curl -s -o x.json -w '%{http_code}' -X PATCH -H "$H" -H "$J" "https://storage.googleapis.com/storage/v1/b/$PB/o/p.gif" -d '{"cacheControl":"no-store, max-age=0"}')"
          # anyone may read what's in the picture bucket (only the picture is ever in it)
          curl -s -H "$H" "https://storage.googleapis.com/storage/v1/b/$PB/iam" > pi.json
          python3 -c 'import json; p=json.load(open("pi.json")); b=p.setdefault("bindings",[]); b.append({"role":"roles/storage.objectViewer","members":["allUsers"]}); json.dump({"bindings":b,"etag":p.get("etag")},open("pi2.json","w"))'
          say "picture public: $(curl -s -o x.json -w '%{http_code}' -X PUT -H "$H" -H "$J" "https://storage.googleapis.com/storage/v1/b/$PB/iam" -d @pi2.json) $(grep -o '"message": *"[^"]*"' x.json | head -1)"
          say "fetch log on: $(curl -s -o x.json -w '%{http_code}' -X PATCH -H "$H" -H "$J" "https://storage.googleapis.com/storage/v1/b/$PB?fields=logging" -d "{\"logging\":{\"logBucket\":\"$LB\",\"logObjectPrefix\":\"open\"}}") $(grep -o '"message": *"[^"]*"' x.json | head -1)"
          say "public fetch test: $(curl -s -o /dev/null -w '%{http_code}' "https://storage.googleapis.com/$PB/p.gif?m=setup-test")"
