# Stencil generator (worker/stencil-gen.mjs, design in docs/stencil-generator.md): reads the Stencil Build tab, draws each
# text stencil from the FHWA alphabets to the shop spec, and saves DXF + proof PNG/SVG + numbers to a new
# stencil-out-<run id> branch (never main, no force push). The Stencil Program Lead (Claude task) then files the files
# in Drive "Stencil Library/<category>/" and writes the row's numbers, links and status 'generated'.
# Inputs: first=1 for the first 25 (STOP / ONLY / numbers / letters at 12, 18, 24 in), limit = how many rows.
name: Stencil generator
on:
  workflow_dispatch:
    inputs:
      first: { description: "1 = first batch only", default: "0" }
      limit: { description: "rows this run", default: "300" }
permissions:
  contents: write
  id-token: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        run: npm install --no-audit --no-fund --loglevel=error 2>&1 | tail -2
      - working-directory: worker
        env:
          SHEETS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GEN_FIRST: ${{ inputs.first == '1' && '1' || '' }}
          GEN_LIMIT: ${{ inputs.limit }}
          GEN_OUT: ${{ github.workspace }}/out
        run: node stencil-gen.mjs
      - name: Save the files to a new stencil-out branch
        run: |
          B="stencil-out-${{ github.run_id }}"
          cd out && git init -q && git checkout -q -b "$B"
          git config user.name "CRM bot" && git config user.email "crm-bot@streetsignsupply.com"
          git add -A && git commit -q -m "Stencil generator output, run ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
          echo "files: branch $B" >> "$GITHUB_STEP_SUMMARY"
