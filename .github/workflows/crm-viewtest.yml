name: Test — customer opened a quote/proof link
# Run by hand: a live test on the internal test project P-2030 that only notifies Matt (marked TEST). Prints yes/no only.
on: { workflow_dispatch: {} }
permissions: { contents: read, id-token: write }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        run: npm install --no-audit --no-fund --loglevel=error @google-cloud/firestore@7 2>&1 | tail -1
      - working-directory: worker
        env: { FIREBASE_PROJECT: ssc-crm-a7224 }
        run: node view-test.mjs
