name: Database rules
# Tests firebase/firestore.rules in the Firestore emulator on every change. Puts them live only when run by hand
# with mode=deploy (and only if the tests pass). mode=rollback with a ruleset name puts an earlier set back.
on:
  push:
    branches: [main]
    paths: ["firebase/**", ".github/workflows/crm-rules.yml"]
  workflow_dispatch:
    inputs:
      mode: { description: "test, deploy or rollback", default: "test" }
      ruleset: { description: "for rollback: the ruleset name to put back", default: "" }
permissions:
  contents: read
  id-token: write
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - working-directory: firebase
        run: npm install --no-audit --no-fund --loglevel=error 2>&1 | tail -2
      - name: Test the rules in the emulator
        if: github.event.inputs.mode != 'rollback'
        working-directory: firebase
        run: npx firebase emulators:exec --only firestore --project demo-ssc "node rules.test.mjs"
      - id: gauth
        if: github.event.inputs.mode == 'deploy' || github.event.inputs.mode == 'rollback'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase
      - if: github.event.inputs.mode == 'deploy' || github.event.inputs.mode == 'rollback'
        working-directory: firebase
        env:
          RULES_TOKEN: ${{ steps.gauth.outputs.access_token }}
          MODE: ${{ github.event.inputs.mode }}
          RULESET: ${{ github.event.inputs.ruleset }}
        run: node deploy.mjs
