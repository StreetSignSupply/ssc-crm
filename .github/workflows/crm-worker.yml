name: CRM worker
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/crm-worker.yml", "worker/**"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: crm-worker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && 'yes' || 'no' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Google sign-in (keyless, no stored key)
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: worker
        run: |
          npm install --no-audit --no-fund --loglevel=error 2>&1 | tail -5 || true
          npx playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { echo "::error::playwright install failed: $(tail -3 /tmp/pw.log | tr '\n' ' ')"; exit 1; }
      - name: Run the CRM
        if: ${{ steps.gauth.outcome == 'success' || env.HAS_KEY == 'yes' }}
        working-directory: worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ssc-crm-a7224
        run: node run.mjs || { echo "::error::worker exited with an error (see message above)"; exit 1; }
