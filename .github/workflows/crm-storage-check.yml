name: CRM storage check (read-only, by hand)
# Can the Firebase files be read, and can the worker reach Google Drive? Counts and status codes only.
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        env: { SA_TOKEN: "${{ steps.gauth.outputs.access_token }}" }
        run: node storage-check.mjs
