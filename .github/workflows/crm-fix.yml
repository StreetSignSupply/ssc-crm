name: CRM fixes (run by hand only)
# Never runs on a push: a fix runs once, when it's started on purpose. A fixes.js that already ran is skipped.
on:
  workflow_dispatch:
    inputs:
      step: { description: "sync or apply", default: "sync" }
permissions:
  contents: read
  id-token: write
concurrency: { group: crm-fix, cancel-in-progress: false }
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/741399760463/locations/global/workloadIdentityPools/github/providers/ssc-crm
          service_account: firebase-adminsdk-fbsvc@ssc-crm-a7224.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: worker
        run: npm install --no-audit --no-fund --loglevel=error 2>&1 | tail -2
      - working-directory: worker
        env:
          FIREBASE_PROJECT: ssc-crm-a7224
          FIX_STEP: ${{ github.event.inputs.step || 'sync' }}
        run: node fix.mjs
