<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Sign Supply — CRM</title>
<style>body{font-family:system-ui,sans-serif;background:#E9EAEC;color:#141414;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}#m{text-align:center}#m b{display:block;font-size:18px;margin-bottom:6px}</style>
</head>
<body><div id="m"><b>Street Sign Supply CRM</b>Loading…</div>
<script>
/* Loads the current CRM build from GitHub (StreetSignSupply/ssc-crm, public/index.html) and runs it here, so
   firebase-adapter.js and the other files next to this page keep working. Keeps the last good build for offline use. */
(async function(){
  var SRC="https://raw.githubusercontent.com/StreetSignSupply/ssc-crm/main/public/index.html";
  var KEY="sscBuild";
  function run(h){document.open();document.write(h);document.close();}
  function msg(t){var m=document.getElementById("m");if(m)m.innerHTML="<b>Street Sign Supply CRM</b>"+t;}
  try{
    var r=await fetch(SRC+"?v="+Math.floor(Date.now()/300000),{cache:"no-store"});
    if(!r.ok)throw new Error("GitHub answered "+r.status);
    var h=await r.text();
    if(h.indexOf("APP_VERSION")<0||h.length<100000)throw new Error("that wasn't the CRM");
    try{localStorage.setItem(KEY,h)}catch(e){}
    run(h);
  }catch(e){
    var old=null;try{old=localStorage.getItem(KEY)}catch(e2){}
    if(old){run(old)}
    else msg("The CRM couldn't be loaded ("+(e&&e.message||"no connection")+"). Check the internet connection and refresh.");
  }
})();
</script>
</body>
</html>
