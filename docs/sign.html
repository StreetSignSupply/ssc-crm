<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Review and approve</title>
<style>
:root{--ink:#16181b;--ink2:#5b6270;--line:#dfe2e7;--bg:#f3f4f6;--card:#fff;--act:#1f5fad;--red:#b3261e;--green:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--ink2);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot td{font-weight:800;border-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.p{background:var(--act);border-color:var(--act);color:#fff}.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px}
canvas{width:100%;height:160px;border:1px dashed #9aa1ad;border-radius:8px;background:#fff;touch-action:none;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.ok{border-color:#b7dcc4;background:#f1faf4}.bad{border-color:#f0c4c0;background:#fdf3f2}
.pdf{width:100%;height:520px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sig{max-height:90px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}.chk input{width:20px;height:20px;margin-top:2px}
@media (max-width:600px){.pdf{height:360px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><b>Loading…</b></div></div>
<script>
/* The customer's page for one quote or proof. It reads only the sign request named in the link, and the database lets it
   change only that request — once — from "sent" to "signed" (or "changes asked for"). */
(function(){
  var P="ssc-crm-a7224",BASE="https://firestore.googleapis.com/v1/projects/"+P+"/databases/(default)/documents/signreq/";
  var q=new URLSearchParams(location.search),T=(q.get("t")||"").replace(/[^a-f0-9]/gi,""),VIEW=q.get("view")==="1";
  var app=document.getElementById("app");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function val(v){if(!v)return null;if("stringValue" in v)return v.stringValue;if("integerValue" in v)return Number(v.integerValue);if("doubleValue" in v)return v.doubleValue;
    if("booleanValue" in v)return v.booleanValue;if("nullValue" in v)return null;if("timestampValue" in v)return Date.parse(v.timestampValue);
    if("arrayValue" in v)return (v.arrayValue.values||[]).map(val);if("mapValue" in v){var o={},f=v.mapValue.fields||{};for(var k in f)o[k]=val(f[k]);return o}return null}
  function money(n){return "$"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
  function when(ms){try{return new Date(ms).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
  function fail(t){app.innerHTML='<div class="card bad"><h1>This link isn\'t working</h1><p>'+esc(t)+'</p></div>'}
  if(!T||T.length<20){fail("The link looks incomplete. Open it again from the email, or ask us for a new one.");return}
  var R=null;
  fetch(BASE+T).then(function(r){if(r.status===404||r.status===403)throw new Error("gone");if(!r.ok)throw new Error("net");return r.json()}).then(function(doc){
    var f=doc.fields||{};R={};for(var k in f)R[k]=val(f[k]);show();
    if(!VIEW&&R.status==="sent"&&!R.viewedAt)patch({viewedAt:{integerValue:String(Date.now())}},["viewedAt"]).catch(function(){});
  }).catch(function(e){fail(e.message==="gone"?"This link has been cancelled or replaced. Ask us for a new one.":"We couldn't load it just now. Check the connection and try again.")});
  function patch(fields,keys){var u=BASE+T+"?"+keys.map(function(k){return "updateMask.fieldPaths="+k}).join("&")+"&currentDocument.exists=true";
    return fetch(u,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fields})}).then(function(r){if(!r.ok)throw new Error("save "+r.status);return r.json()})}
  function head(){var isQ=R.kind!=="proof";
    return '<div class="card"><div class="sub">'+esc(R.company||"")+'</div><h1>'+esc(R.title||"")+'</h1><div class="sub">For '+esc(R.customer||"")+(R.contactName?" · "+esc(R.contactName):"")+'</div>'
      +(isQ&&R.lines&&R.lines.length?'<table style="margin-top:14px"><thead><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Each</th><th style="text-align:right">Total</th></tr></thead><tbody>'
        +R.lines.map(function(l){return '<tr><td>'+esc(l.d)+'</td><td class="n">'+esc(l.q)+'</td><td class="n">'+money(l.p)+'</td><td class="n">'+money(l.q*l.p)+'</td></tr>'}).join("")
        +'<tr class="tot"><td colspan="3">Total before tax</td><td class="n">'+esc(R.total||"")+'</td></tr></tbody></table>':"")
      +(R.pdfUrl?'<div class="row"><a class="btn" href="'+esc(R.pdfUrl)+'" target="_blank" rel="noopener">Open '+esc(R.pdfName||"the document")+'</a></div>'
        +(/\.pdf($|\?)/i.test(R.pdfName||"")||/pdf/i.test(R.pdfName||"")?'<iframe class="pdf" style="margin-top:12px" src="'+esc(R.pdfUrl)+'" title="Document"></iframe>':'<img src="'+esc(R.pdfUrl)+'" alt="Proof" style="max-width:100%;margin-top:12px;border:1px solid #dfe2e7;border-radius:8px">'):"")+'</div>'}
  function show(){var isQ=R.kind!=="proof",what=isQ?"quote":"proof";
    if(R.status==="signed"){app.innerHTML=head()+'<div class="card ok"><h2>Approved'+(VIEW?"":" — thank you")+'</h2><p>Signed by <b>'+esc(R.signedName)+'</b>'+(R.signedTitle?", "+esc(R.signedTitle):"")+' on '+esc(when(R.signedAt))+'.</p>'
        +(R.sigImg?'<img class="sig" src="'+esc(R.sigImg)+'" alt="Signature">':"")+(R.note?'<p class="sub">Note: '+esc(R.note)+'</p>':"")
        +'<p class="sub">Record '+esc(T.slice(0,8))+' · '+esc(R.company||"")+(R.companyPhone?" · "+esc(R.companyPhone):"")+'</p></div>';return}
    if(R.status==="declined"){app.innerHTML=head()+'<div class="card"><h2>Changes asked for</h2><p>'+esc(R.signedName||"")+' asked for changes on '+esc(when(R.signedAt))+(R.note?': “'+esc(R.note)+'”':"")+'. We\'ll be in touch with an updated '+what+'.</p></div>';return}
    if(R.status!=="sent"){fail("This link has been cancelled. Ask us for a new one.");return}
    if(R.expiresAt&&R.expiresAt<Date.now()){fail("This link has expired. Reply to our email and we'll send a fresh one.");return}
    if(VIEW){app.innerHTML=head()+'<div class="card"><h2>Waiting for approval</h2></div>';return}
    app.innerHTML=head()+'<div class="card"><h2>Approve this '+what+'</h2><p class="sub">Type your name, sign in the box with your finger or mouse, and press Approve. '+(isQ?"Approving tells us to go ahead with the order at the prices above (tax and shipping as quoted).":"Approving tells us the artwork is right to make.")+'</p>'
      +'<label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name" value="'+esc(R.contactName||"")+'">'
      +'<label for="tt">Title (optional)</label><input type="text" id="tt" autocomplete="organization-title">'
      +'<label>Signature</label><canvas id="cv" aria-label="Sign here"></canvas><div class="row" style="margin-top:6px"><button class="btn" type="button" id="clr">Clear</button><span class="sub">Sign above</span></div>'
      +'<label class="chk"><input type="checkbox" id="ag"> <span>I approve this '+what+' on behalf of '+esc(R.customer||"my organization")+', and agree this electronic signature counts as my signature.</span></label>'
      +'<label for="nt">Note (optional)</label><textarea id="nt" placeholder="Anything we should know"></textarea>'
      +'<div class="row"><button class="btn p" type="button" id="go">Approve and sign</button><button class="btn" type="button" id="no">Ask for changes</button></div><p class="sub" id="msg"></p></div>';
    var cv=document.getElementById("cv"),cx=cv.getContext("2d"),drawn=false,down=false,last=null;
    function size(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.scale(d,d);cx.lineWidth=2.4;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111"}
    size();
    function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
    cv.addEventListener("pointerdown",function(e){down=true;last=pt(e);cv.setPointerCapture(e.pointerId)});
    cv.addEventListener("pointermove",function(e){if(!down)return;var p=pt(e);cx.beginPath();cx.moveTo(last[0],last[1]);cx.lineTo(p[0],p[1]);cx.stroke();last=p;drawn=true});
    cv.addEventListener("pointerup",function(){down=false});cv.addEventListener("pointercancel",function(){down=false});
    document.getElementById("clr").onclick=function(){cx.clearRect(0,0,cv.width,cv.height);drawn=false};
    var msg=document.getElementById("msg");
    function small(){var w=Math.min(600,cv.width),h=Math.round(cv.height*w/cv.width),c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(cv,0,0,w,h);return c.toDataURL("image/png")}
    function send(status){var nm=document.getElementById("nm").value.trim(),tt=document.getElementById("tt").value.trim(),nt=document.getElementById("nt").value.trim();
      if(nm.length<2){msg.textContent="Type your full name.";return}
      if(status==="signed"&&!drawn){msg.textContent="Sign in the box first.";return}
      if(status==="signed"&&!document.getElementById("ag").checked){msg.textContent="Tick the box to approve.";return}
      if(status==="declined"&&!nt){msg.textContent="Tell us what to change in the note.";return}
      var now=Date.now(),f={status:{stringValue:status},signedName:{stringValue:nm.slice(0,110)},signedTitle:{stringValue:tt.slice(0,80)},signedAt:{integerValue:String(now)},note:{stringValue:nt.slice(0,800)},ua:{stringValue:navigator.userAgent.slice(0,200)}};
      var keys=["status","signedName","signedTitle","signedAt","note","ua"];if(status==="signed"){f.sigImg={stringValue:small()};keys.push("sigImg")}
      document.getElementById("go").disabled=document.getElementById("no").disabled=true;msg.textContent="Saving…";
      patch(f,keys).then(function(){R.status=status;R.signedName=nm;R.signedTitle=tt;R.signedAt=now;R.note=nt;R.sigImg=f.sigImg?f.sigImg.stringValue:"";show();window.scrollTo(0,0)})
        .catch(function(){msg.textContent="That didn't save. Check the connection and try again — or reply to our email.";document.getElementById("go").disabled=document.getElementById("no").disabled=false})}
    document.getElementById("go").onclick=function(){send("signed")};document.getElementById("no").onclick=function(){send("declined")};
  }
})();
</script>
</body>
</html>
